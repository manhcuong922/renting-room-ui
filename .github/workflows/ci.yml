name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Cảnh báo lỗ hổng gói production mức cao trở lên.
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      # Bí mật không được lọt vào bundle: mọi biến VITE_* đều công khai trong JS gửi cho trình duyệt.
      - name: Không có biến bí mật trong .env.example
        run: "! grep -iE '^VITE_[A-Z_]*(SECRET|TOKEN|PASSWORD|API_KEY|PRIVATE)' .env.example"
